[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_da"]

[tool.hatch.build.targets.wheel.force-include]
"src/sql_da/_sitecustomize.py" = "sitecustomize.py"

[project]
name = "sql-da"
version = "0.1.0"
description = "A LangChain Deep Agents SQL analyst for financial variance root-cause reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.0",
    "langchain>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-google-genai>=3.0.0",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
]

[project.scripts]
sql-da = "sql_da.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/sql_da --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["src/sql_da"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise SystemExit",
]
