version: 1
nodes:
  gl_entries:
    type: raw_table
    grain: one row per accounting entry
    description: Posted general ledger entries sourced from billing, payroll, and AP systems.
    columns:
      - entry_id
      - entry_month
      - account_id
      - department_id
      - source_table
      - source_id
      - amount
  invoices:
    type: raw_table
    grain: one row per monthly customer invoice
    description: Customer invoices generated from active contracts.
    columns:
      - invoice_id
      - invoice_month
      - customer_id
      - product_id
      - amount
      - quantity
  customer_contracts:
    type: raw_table
    grain: one row per commercial contract line
    description: Contract terms that drive recurring invoices.
    columns:
      - contract_id
      - customer_id
      - product_id
      - start_month
      - end_month
      - monthly_amount
  vendor_bills:
    type: raw_table
    grain: one row per vendor invoice
    description: Vendor AP bills, including cloud COGS and operating expenses.
    columns:
      - bill_id
      - bill_month
      - vendor_name
      - department_id
      - account_id
      - amount
      - description
  payroll_runs:
    type: raw_table
    grain: one row per department payroll run per month
    description: Payroll cost and headcount by department.
    columns:
      - payroll_id
      - pay_month
      - department_id
      - employee_count
      - gross_pay
      - bonus_pay
  departments:
    type: dimension
    grain: one row per department
    description: Department dimension used by payroll and expense allocations.
    columns:
      - department_id
      - department_name
  accounts:
    type: dimension
    grain: one row per chart-of-accounts entry
    description: Financial statement classification for GL entries and vendor bills.
    columns:
      - account_id
      - account_name
      - statement_line
  customers:
    type: dimension
    grain: one row per customer
    description: Customer dimension with segment and status.
    columns:
      - customer_id
      - customer_name
      - segment
      - status
  products:
    type: dimension
    grain: one row per product
    description: Product dimension used for revenue mix and COGS analysis.
    columns:
      - product_id
      - product_name
      - gross_margin_profile
      - cogs_rate
  expected_data_quality_issues:
    type: metadata_table
    grain: one row per seeded data quality issue
    description: Expected data quality defects used by tests and reward verification.
    columns:
      - issue_id
      - check_name
      - severity
      - table_name
      - period
      - expected_description
      - expected_keywords
  mart_revenue_monthly:
    type: mart_view
    grain: one row per month
    description: Monthly revenue recognized from invoices.
    upstream:
      - invoices
      - customer_contracts
      - customers
      - products
    columns:
      - month
      - revenue
  mart_cogs_monthly:
    type: mart_view
    grain: one row per month
    description: Monthly cloud and delivery cost classified as COGS.
    upstream:
      - vendor_bills
      - accounts
      - products
    columns:
      - month
      - cogs
  mart_payroll_monthly:
    type: mart_view
    grain: one row per month
    description: Monthly payroll expense by pay period.
    upstream:
      - payroll_runs
      - departments
    columns:
      - month
      - payroll_expense
  mart_vendor_spend_monthly:
    type: mart_view
    grain: one row per month
    description: Monthly non-COGS vendor spend.
    upstream:
      - vendor_bills
      - departments
      - accounts
    columns:
      - month
      - vendor_expense
  mart_department_expense_monthly:
    type: mart_view
    grain: one row per department per month
    description: Operating expense by department from payroll and vendor spend.
    upstream:
      - payroll_runs
      - vendor_bills
      - departments
      - accounts
    columns:
      - month
      - department_name
      - expense_type
      - amount
  mart_financials_monthly:
    type: mart_view
    grain: one row per metric per month
    description: Monthly financial statement metrics used for variance detection.
    upstream:
      - mart_revenue_monthly
      - mart_cogs_monthly
      - mart_payroll_monthly
      - mart_vendor_spend_monthly
    columns:
      - month
      - metric
      - value
relationships:
  invoice_customer:
    description: Invoices join to the customer dimension for customer and segment analysis.
    left: invoices.customer_id
    right: customers.customer_id
    relationship_type: many_to_one
    join_type: inner
  invoice_product:
    description: Invoices join to the product dimension for product revenue and COGS-rate analysis.
    left: invoices.product_id
    right: products.product_id
    relationship_type: many_to_one
    join_type: inner
  contract_customer:
    description: Contract lines join to customers for contract and billing quality checks.
    left: customer_contracts.customer_id
    right: customers.customer_id
    relationship_type: many_to_one
    join_type: inner
  contract_product:
    description: Contract lines join to products for product-level recurring revenue terms.
    left: customer_contracts.product_id
    right: products.product_id
    relationship_type: many_to_one
    join_type: inner
  vendor_bill_account:
    description: Vendor bills join to accounts to classify COGS versus operating expense.
    left: vendor_bills.account_id
    right: accounts.account_id
    relationship_type: many_to_one
    join_type: inner
  vendor_bill_department:
    description: Vendor bills join to departments for operating expense ownership.
    left: vendor_bills.department_id
    right: departments.department_id
    relationship_type: many_to_one
    join_type: inner
  payroll_department:
    description: Payroll runs join to departments for department-level payroll analysis.
    left: payroll_runs.department_id
    right: departments.department_id
    relationship_type: many_to_one
    join_type: inner
  gl_entry_account:
    description: GL entries join to accounts for financial statement classification.
    left: gl_entries.account_id
    right: accounts.account_id
    relationship_type: many_to_one
    join_type: inner
transformations:
  monthly_revenue:
    description: Monthly revenue is summarized from invoice amount by invoice month.
    output: mart_revenue_monthly.revenue
    operation: aggregate
    expression: ROUND(SUM(invoices.amount), 2)
    grain: one row per invoice month
    source_nodes:
      - invoices
    inputs:
      - invoices.amount
      - invoices.invoice_month
    group_by:
      - invoices.invoice_month
  cloud_cogs_bill_amount:
    description: Synthetic CloudCo COGS bills are generated by multiplying product revenue by product COGS rate.
    output: vendor_bills.amount
    operation: multiply_then_insert
    expression: ROUND(SUM(invoices.amount) * products.cogs_rate, 2)
    grain: one CloudCo vendor bill per month and product
    source_nodes:
      - invoices
      - products
      - vendor_bills
    inputs:
      - invoices.amount
      - invoices.invoice_month
      - invoices.product_id
      - products.product_id
      - products.cogs_rate
    group_by:
      - invoices.invoice_month
      - invoices.product_id
    filters:
      - vendor_bills.vendor_name = 'CloudCo'
      - vendor_bills.account_id = 5000
  monthly_cogs:
    description: Monthly COGS is summarized from CloudCo and other vendor bills classified to the COGS account.
    output: mart_cogs_monthly.cogs
    operation: aggregate
    expression: ROUND(SUM(vendor_bills.amount), 2)
    grain: one row per bill month
    source_nodes:
      - vendor_bills
      - accounts
    inputs:
      - vendor_bills.amount
      - vendor_bills.bill_month
      - vendor_bills.account_id
    group_by:
      - vendor_bills.bill_month
    filters:
      - vendor_bills.account_id = 5000
  monthly_payroll:
    description: Monthly payroll expense sums gross pay and bonus pay by pay month.
    output: mart_payroll_monthly.payroll_expense
    operation: aggregate
    expression: ROUND(SUM(payroll_runs.gross_pay + payroll_runs.bonus_pay), 2)
    grain: one row per pay month
    source_nodes:
      - payroll_runs
    inputs:
      - payroll_runs.gross_pay
      - payroll_runs.bonus_pay
      - payroll_runs.pay_month
    group_by:
      - payroll_runs.pay_month
  monthly_vendor_expense:
    description: Monthly vendor expense summarizes non-COGS vendor bills.
    output: mart_vendor_spend_monthly.vendor_expense
    operation: aggregate
    expression: ROUND(SUM(vendor_bills.amount), 2)
    grain: one row per bill month
    source_nodes:
      - vendor_bills
      - accounts
    inputs:
      - vendor_bills.amount
      - vendor_bills.bill_month
      - vendor_bills.account_id
    group_by:
      - vendor_bills.bill_month
    filters:
      - vendor_bills.account_id != 5000
  financial_statement_metrics:
    description: Financial statement metrics are calculated from monthly revenue, COGS, payroll, and vendor expense marts.
    output: mart_financials_monthly.value
    operation: metric_formula
    expression: revenue; cogs; gross_margin = revenue - cogs; operating_expense = payroll_expense + vendor_expense; net_income = revenue - cogs - payroll_expense - vendor_expense
    grain: one row per month and metric
    source_nodes:
      - mart_revenue_monthly
      - mart_cogs_monthly
      - mart_payroll_monthly
      - mart_vendor_spend_monthly
    inputs:
      - mart_revenue_monthly.revenue
      - mart_cogs_monthly.cogs
      - mart_payroll_monthly.payroll_expense
      - mart_vendor_spend_monthly.vendor_expense
      - mart_financials_monthly.metric
      - mart_financials_monthly.month
    group_by:
      - mart_financials_monthly.month
metric_mappings:
  revenue:
    node: mart_revenue_monthly
    value_column: revenue
  cogs:
    node: mart_cogs_monthly
    value_column: cogs
  gross_margin:
    node: mart_financials_monthly
    value_column: value
  payroll_expense:
    node: mart_payroll_monthly
    value_column: payroll_expense
  vendor_expense:
    node: mart_vendor_spend_monthly
    value_column: vendor_expense
  operating_expense:
    node: mart_financials_monthly
    value_column: value
  net_income:
    node: mart_financials_monthly
    value_column: value
